# Dokploy & Universal Single-Application Stack for Stash
# In Dokploy: Deploy this Compose file as one service and attach your domain to service "gateway" on port 8080.
# Locally:    docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string routes browser requests cleanly to same-origin /api/v1/* through gateway
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    depends_on:
      - pot-provider
      - warp
    environment:
      STASH_PORT: "4000"
      STASH_TRUST_PROXY: "true"
      STASH_TEMP_DIR: "/tmp/stash-jobs"
      STASH_MAX_CONCURRENT_JOBS: "${STASH_MAX_CONCURRENT_JOBS:-2}"
      STASH_MAX_CONCURRENT_TRACKS: "${STASH_MAX_CONCURRENT_TRACKS:-2}"
      STASH_FRAGMENTS_SINGLE: "${STASH_FRAGMENTS_SINGLE:-4}"
      STASH_FRAGMENTS_PLAYLIST: "${STASH_FRAGMENTS_PLAYLIST:-2}"
      STASH_JOB_TTL_MINUTES: "${STASH_JOB_TTL_MINUTES:-30}"
      STASH_POT_PROVIDER_URL: "http://pot-provider:4416"
      STASH_ALLOWED_ORIGINS: "${STASH_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}"
      # Routes yt-dlp through the rootless Cloudflare WARP SOCKS5 sidecar by default (set to "direct" or custom URL to override)
      STASH_PROXY_URL: "${STASH_PROXY_URL:-socks5h://warp:1080}"
      # Optional: only needed if you also want authenticated YouTube cookies
      STASH_COOKIES_FILE: "${STASH_COOKIES_FILE:-}"
      STASH_COOKIES_B64: "${STASH_COOKIES_B64:-}"
    volumes:
      - stash_temp:/tmp/stash-jobs
    deploy:
      resources:
        limits:
          memory: 1024M

  warp:
    build:
      context: ./warp
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "1080"
    volumes:
      - warp_config:/config
    deploy:
      resources:
        limits:
          memory: 64M

  pot-provider:
    image: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped
    expose:
      - "4416"
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  stash_temp:
  warp_config:
